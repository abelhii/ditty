name: image

# Builds the web export into an nginx image and pushes ghcr.io/abelhii/ditty.
# The homelab runs it at sites.abelhii.com/ditty (behind Authentik).
# The /ditty base path comes from app.json experiments.baseUrl.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ditty

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build for test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ditty:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name ditty --read-only --tmpfs /tmp -p 8080:8080 ditty:ci
          sleep 2
          for path in /healthz / /home /library/album/x /settings; do
            curl -fsS -o /dev/null "http://127.0.0.1:8080$path" || { echo "FAIL $path"; docker logs ditty; exit 1; }
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q '/ditty/_expo/' || { echo "FAIL: /ditty base path missing"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nope)" = 404

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
