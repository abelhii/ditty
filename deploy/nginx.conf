# Serves the Expo static export. Caddy strips /ditty before the request gets here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Run from a read-only container: keep temp files in /tmp (a tmpfs).
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    absolute_redirect off;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed bundles never change, so cache them for a long time.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Dynamic routes: /library/album/123 is served by library/album/[id].html,
    # and expo-router reads the real id from the URL in the browser.
    location ~ ^/(home|library|my-music|search)/(album|artist|playlist)/[^/]+/?$ {
        add_header Cache-Control "no-cache";
        try_files $uri "/$1/$2/[id].html" =404;
    }
    location ~ ^/library/genre/[^/]+/?$ {
        add_header Cache-Control "no-cache";
        try_files $uri "/library/genre/[name].html" =404;
    }

    # Static routes are /foo.html or /foo/index.html. Anything else is a 404.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /+not-found.html;
}
